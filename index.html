<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>なっとく数Ⅱ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231767a3'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='serif'%3E%E2%85%A1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap">
<style>
/* Layout: one narrow column (max 560px). Lesson = stack of sections; each item is a card with its own feedback line. */
:root{
  --bg:#f4f5f1; --surface:#ffffff; --ink:#1b2422; --muted:#5f6d69; --line:#d8dfdb;
  --teal:#0f6e78; --teal-soft:#e2f1f2; --orange:#c0571b; --orange-soft:#fbeee6;
  --ok:#1f7a45; --ok-soft:#e3f3e9; --grid:#e1e6e3; --axis:#7d8a86;
  --z1:#c2581c; --z2:#6b4da0; --z3:#1767a3; --z4:#25804b;
  --z1s:#fbeee6; --z2s:#efe9f7; --z3s:#e4eff8; --z4s:#e3f2e8;
  --c1:#1767a3; --c2:#c2581c; --c3:#25804b; --c4:#9a3a8e;
  --t1:#0f6e78; --t2:#2f8a55; --t3:#c0571b; --t4:#6a4c9c; --t5:#5d6668;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  --f-math:"STIX Two Text","Times New Roman","DejaVu Serif",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211f; --ink:#e6eeeb; --muted:#9aaba6; --line:#2c3935;
  --teal:#4fb7c2; --teal-soft:#16353a; --orange:#f08a4b; --orange-soft:#3a2418;
  --ok:#5fcf8a; --ok-soft:#173326; --grid:#26312e; --axis:#7f908b;
  --z1:#ec8a4f; --z2:#a589dc; --z3:#5aa7e0; --z4:#5fc48a;
  --z1s:#3a2418; --z2s:#2a2238; --z3s:#16293a; --z4s:#173326;
  --c1:#5aa7e0; --c2:#ec8a4f; --c3:#5fc48a; --c4:#d77fcc;
  --t1:#2f9aa5; --t2:#3f9c66; --t3:#d06a2d; --t4:#8466b8; --t5:#6f7a7c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211f; --ink:#e6eeeb; --muted:#9aaba6; --line:#2c3935;
  --teal:#4fb7c2; --teal-soft:#16353a; --orange:#f08a4b; --orange-soft:#3a2418;
  --ok:#5fcf8a; --ok-soft:#173326; --grid:#26312e; --axis:#7f908b;
  --z1:#ec8a4f; --z2:#a589dc; --z3:#5aa7e0; --z4:#5fc48a;
  --z1s:#3a2418; --z2s:#2a2238; --z3s:#16293a; --z4s:#173326;
  --c1:#5aa7e0; --c2:#ec8a4f; --c3:#5fc48a; --c4:#d77fcc;
  --t1:#2f9aa5; --t2:#3f9c66; --t3:#d06a2d; --t4:#8466b8; --t5:#6f7a7c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;margin:0}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 120px}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
b{font-weight:700}

/* ---- math ---- */
.mx{font-family:var(--f-math);font-size:1.1em;white-space:nowrap}
.mx i{font-style:italic}
.mx .fn,.mx .tx{font-style:normal}
.mx .fn{margin-left:.15em}
.mx>.fn:first-child{margin-left:0}
.mx .tx{font-family:var(--f-body);font-size:.9em}
.mx sup,.mx sub{font-size:.68em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.12;margin:0 .1em;font-size:.9em}
.fr>span{display:block;padding:0 .12em}
.fr>span:first-child{border-bottom:.07em solid currentColor}
.rt{white-space:nowrap;display:inline-flex;align-items:flex-start}
.rt .rs{margin-right:-.02em}
.rt .ra{border-top:.07em solid currentColor;padding:0 .08em;margin-top:.12em;line-height:1.2}
.rt .ri{font-size:.58em;margin-right:-.35em;margin-top:.05em}
.ss,.il{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.62em;line-height:1.15;margin-left:.05em}
.ig{font-size:1.25em;vertical-align:-.12em}
.il{margin-left:-.05em}
.lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:-.45em;line-height:1.05;margin-right:.15em}
.lim .lu{font-size:.62em}
.bk{font-size:1.15em}
.mx .sp{margin-right:.08em}

/* ---- top bar ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.bar .back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.bar .ttl{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sc{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);white-space:nowrap}
.streak{font-size:13px;font-weight:700;color:var(--orange);white-space:nowrap}

/* ---- home ---- */
.hero{padding:18px 0 4px}
.hero .eb{font-size:13px;letter-spacing:.12em;color:var(--teal);font-weight:700}
.hero h1{font-size:38px;font-weight:900;line-height:1.1;margin-top:4px}
.hero h1 small{display:block;font-size:15px;font-weight:700;color:var(--muted);margin-top:6px;letter-spacing:.04em}
.hero p{color:var(--muted);margin:10px 0 0}
.who{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0;display:grid;gap:10px}
.who label{font-size:13px;color:var(--muted);display:block;margin-bottom:2px}
.who input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.whynote{font-size:12px;color:var(--muted)}
.links{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 8px}
.links a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--teal);font-weight:700;border:1.5px solid var(--teal);border-radius:999px;padding:6px 14px;font-size:14px}
.zone{margin-top:24px}
.zh{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.zh .zn{font-size:22px;font-weight:900}
.zh .zs{font-size:13px;color:var(--muted)}
.zh .zst{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lessons{display:grid;gap:10px}
.lcard{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;width:100%}
.lcard .no{grid-row:span 2;width:50px;height:50px;border-radius:14px;color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;line-height:1}
.lcard .no small{display:block;font-size:10px;font-weight:700;letter-spacing:.06em}
.lcard .t{font-weight:700;font-size:16px;line-height:1.35}
.lcard .meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);grid-column:2}
.lcard .stars{grid-row:span 2;grid-column:3;font-size:15px;letter-spacing:-.05em;color:var(--line)}
.lcard .stars .on{color:#e0a020}
.track{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.track span{display:block;height:100%}
.pill.warn{background:var(--orange-soft);color:var(--orange)}
.pill{font-size:12px;border-radius:99px;padding:1px 8px;background:var(--ok-soft);color:var(--ok);font-weight:700;white-space:nowrap}
.note{font-size:13px;color:var(--muted);margin-top:22px}

/* ---- lesson ---- */
.goal{border:1.5px solid var(--zc);background:var(--zs);border-radius:12px;padding:10px 12px;font-size:15px}
.goal b{color:var(--zc)}
.sec{margin-top:26px}
.sh{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--zc,var(--teal));padding-bottom:4px;margin-bottom:10px}
.tag{color:#fff;font-weight:700;font-size:13px;border-radius:99px;padding:1px 10px;white-space:nowrap}
.sh h2{font-size:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card.info{border-color:var(--teal)}
.card.info .k{font-weight:700;color:var(--teal);font-size:13px;display:block}
.card.nazo{border:2px dashed var(--orange);background:var(--orange-soft)}
.card.nazo .k{color:var(--orange)}
.card.boss{border:2px solid var(--t4);background:color-mix(in srgb,var(--t4) 8%,var(--surface))}
.card.boss .k{color:var(--t4)}
.card.word{border-color:var(--zc);border-width:1.5px}
.card.word .k{color:var(--zc)}
.q{font-weight:700;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;min-width:56px;padding:6px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:17px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--orange);background:var(--orange-soft)}
.opt:disabled{cursor:default}
.go{margin-top:10px;min-height:44px;padding:8px 20px;border:none;border-radius:12px;background:var(--teal);color:#fff;font-weight:700;cursor:pointer}
.go.sub{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.go:disabled{opacity:.4;cursor:default}
.fb{min-height:1.2em;margin-top:8px;font-size:15px}
.fb.ok{color:var(--ok);font-weight:700}
.fb.ng{color:var(--orange);font-weight:700}
.fb .hint{display:block;font-weight:400;color:var(--muted)}
.why{margin-top:8px;font-size:14px;color:var(--ink);background:var(--ok-soft);border-radius:10px;padding:8px 10px}
.why::before{content:"なるほど　";font-weight:700;color:var(--ok)}
.reveal{margin-top:6px;font-size:14px;background:none;border:none;color:var(--teal);text-decoration:underline;cursor:pointer;padding:4px 0}
.cls{display:grid;gap:8px}
.cls .r{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.cls .r:last-child{border-bottom:none}
.cls .opts{flex-wrap:nowrap}
textarea{width:100%;min-height:76px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}

/* ---- fill-in with keypad ---- */
.fillrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.abox{min-width:7em;min-height:46px;padding:6px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-family:var(--f-math);font-size:20px;display:inline-flex;align-items:center;cursor:text;flex:0 1 auto}
.abox.act{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.abox.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.abox .ph{color:var(--muted);font-family:var(--f-body);font-size:14px}
.abox .cur{display:inline-block;width:2px;height:1.1em;background:var(--teal);margin-left:1px;vertical-align:middle}
@media (prefers-reduced-motion:no-preference){.abox .cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}}
.abox sup{font-size:.62em}
.kp{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.12);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.kp .in{max-width:560px;margin:0 auto}
.kp .prev{display:flex;align-items:center;gap:8px;padding:0 4px 6px;font-size:13px;color:var(--muted)}
.kp .prev .abox{min-height:38px;font-size:18px;flex:1}
.kp .keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.kp button{min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:19px;cursor:pointer;font-family:var(--f-math)}
.kp button.fx{font-family:var(--f-body);font-size:15px;font-weight:700}
.kp button.ent{background:var(--teal);color:#fff;border-color:var(--teal);grid-column:span 2}
.kp button.cls2{color:var(--muted)}
.kp button.op{background:var(--teal-soft)}
.kp .kpgap{visibility:hidden}
.kp .kph{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 2px 6px}
.kp .kpclose{min-height:32px;border:none;background:none;font-family:var(--f-body);font-size:13px;color:var(--teal);font-weight:700;padding:0 6px}

/* ---- figures / widgets ---- */
.fig{text-align:center;margin:6px 0}
.fig svg{max-width:100%;height:auto}
.wg{background:var(--surface);border:1.5px solid var(--zc,var(--teal));border-radius:14px;padding:10px 12px;margin:10px 0}
.wg .wt{font-size:13px;font-weight:700;color:var(--zc,var(--teal));margin-bottom:4px}
.wg svg{width:100%;height:auto;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ro{font-size:15px;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.6}
.ro .big{font-size:20px;font-weight:900}
.ro table{border-collapse:collapse;margin:4px auto;font-size:14px}
.ro td,.ro th{border:1px solid var(--line);padding:2px 8px;text-align:right}
.ro th{background:var(--bg);font-weight:700}
.sl{display:grid;grid-template-columns:auto 1fr 4.6em;align-items:center;gap:10px;margin-top:6px}
.sl label{font-size:14px;font-weight:700;white-space:nowrap}
.sl output{font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
input[type=range]{width:100%;height:32px;accent-color:var(--teal);margin:0}
.wbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.wbtns button{min-height:44px;padding:6px 14px;border-radius:12px;border:1.5px solid var(--teal);background:var(--teal-soft);color:var(--teal);font-weight:700;cursor:pointer}
.wbtns button.on{background:var(--teal);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{min-width:3.4em;padding:6px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-variant-numeric:tabular-nums;font-size:15px}
.chip.on{border-color:var(--c2);background:var(--orange-soft);font-weight:700}
.chip small{display:block;font-size:11px;color:var(--muted)}

/* ---- reflection & send ---- */
.rate{display:flex;gap:10px}
.rate .opt{font-size:22px;min-width:64px}
.send{background:var(--surface);border:2px solid var(--teal);border-radius:16px;padding:14px;margin-top:22px}
.send .sum{font-size:15px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.send a.go{display:inline-block;text-decoration:none;text-align:center}
.send small{display:block;color:var(--muted);margin-top:8px}
.clear{display:none;text-align:center;margin:18px 0 0}
.clear.on{display:block}
.clear .stamp{display:inline-block;border:4px solid var(--orange);color:var(--orange);font-weight:900;font-size:28px;letter-spacing:.2em;padding:4px 18px;border-radius:12px;transform:rotate(-6deg)}
@media (prefers-reduced-motion:no-preference){.clear.on .stamp{animation:st .5s cubic-bezier(.2,1.6,.4,1)}@keyframes st{from{transform:rotate(-6deg) scale(2);opacity:0}}}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);font-weight:700;border-radius:14px;padding:8px 16px;font-size:14px;line-height:1.5;text-align:center;width:max-content;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:.92}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.sendnote{display:flex;align-items:center;gap:6px;width:100%;text-align:left;margin-top:8px;padding:8px 12px;border-radius:12px;border:1.5px dashed var(--teal);background:var(--surface);color:var(--ink);font-size:14px;cursor:pointer}
.sendnote b{color:var(--teal)}
.sendnote .tx{flex:1;min-width:0}
.sendnote .ar{color:var(--teal);font-weight:700}
.send.need{border-color:var(--orange);box-shadow:0 0 0 4px var(--orange-soft)}
.clear p{margin:8px 0 0;font-weight:700;color:var(--orange)}

/* ---- 手書きメモ ---- */
.memofab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border:none;border-radius:999px;padding:12px 18px;background:var(--orange);color:#fff;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.22);cursor:pointer}
.memofab.hid{display:none}
.memo{position:fixed;left:0;right:0;bottom:0;height:46vh;z-index:25;background:var(--surface);border-top:2px solid var(--orange);box-shadow:0 -8px 24px rgba(0,0,0,.16);display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.memo.on{display:flex}
.memo.big{height:72vh}
.memo .mbar{display:grid;grid-template-columns:1.15fr 1.15fr 1.2fr 1.15fr .6fr 1fr;gap:4px;padding:6px 8px;flex:0 0 auto;max-width:560px;width:100%;margin:0 auto}
.memo .mbar button{min-width:0;min-height:42px;padding:2px 2px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden}
.memo .mbar button.on{border-color:var(--orange);background:var(--orange-soft);font-weight:700}
.memo .mbar .mclose{color:var(--teal);font-weight:700;border-color:var(--teal)}
.memo .mcv{flex:1 1 auto;min-height:0;margin:0 8px 8px;border-radius:10px;border:1px solid var(--line);overflow:hidden;
  background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
.memo canvas{display:block;touch-action:none;cursor:crosshair}

/* ---- なんで？ ---- */
.askcard{border:2px solid var(--t4)}
.askcard>.q{color:var(--t4)}
.asknote{display:block;color:var(--muted);font-size:12px;margin:-4px 0 8px}
.qtypes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink);text-align:left}
.qtypes .chip{border-color:var(--t4);color:var(--t4);background:var(--surface)}
.qalist{display:grid;gap:12px;margin-top:12px}
.qa{display:grid;gap:6px}
.qq{justify-self:end;max-width:92%;background:var(--teal-soft);border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:15px}
.qq span{margin-right:4px}
.qr{max-width:96%;background:var(--bg);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:15px}
.qr p{margin:0;white-space:pre-wrap}
.qk{font-weight:700;color:var(--t4);font-size:13px;margin-bottom:2px}
.qc{margin-top:6px;padding:6px 10px;border-radius:10px;background:var(--orange-soft);font-size:14px}
.qc b{color:var(--orange);margin-right:4px}
.qt{max-width:96%;background:var(--ok-soft);border-radius:14px;padding:8px 12px;font-size:15px;white-space:pre-wrap}
.qt b{display:block;color:var(--ok);font-size:13px}
.qn{display:flex;flex-wrap:wrap;gap:6px}
.qn small{width:100%;color:var(--muted);font-size:12px}
.qhead{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 4px}
@media (prefers-reduced-motion:no-preference){.dots::after{content:"…";animation:dt 1s steps(3) infinite}@keyframes dt{0%{content:"."}33%{content:".."}66%{content:"..."}}}

.gbtn{justify-self:start;display:inline-block;text-decoration:none;font-size:14px;font-weight:700;color:var(--teal);border:1.5px solid var(--teal);border-radius:999px;padding:6px 14px;background:var(--surface)}
.qnote{display:grid;gap:4px}
.qnote small{color:var(--muted);font-size:12px}
.qnote textarea{min-height:56px}
.qnote .go{margin-top:0;justify-self:start;min-height:38px;padding:4px 16px}
.qf{background:var(--teal-soft)}
.qf b{color:var(--teal)}

</style>
</head><body>
<div class="wrap" id="app"></div>
<script>
/* ===== ミニ数式記法 → HTML =====
   本文中の $ ... $ の中だけを数式として変換する。コマンドは「@」で始める（JS の \ エスケープを避けるため）。
   @frac{a}{b}  分数        @sqrt{x} @sqrt[3]{x}  根号
   x^{..} x^2   上つき       x_{..} x_2  下つき（両方つくと縦に重ねる）
   @log @sin @cos @tan @lim_{h@to 0}  関数名      @int_a^b  積分記号
   @pi @theta @alpha @beta @to @le @ge @times @cdot @infty  記号
   @[ @]  大かっこ（[F(x)]_a^b 用）   @text{...} ふつうの文字
   英字はイタリック、数字・記号はそのまま。 */
const TEX = (() => {
  const SYM = {pi:"π", theta:"θ", alpha:"α", beta:"β", to:"→", le:"≦", ge:"≧", times:"×", div:"÷",
               cdot:"·", infty:"∞", pm:"±", ne:"≠", fallingdotseq:"≒", approx:"≒", deg:"°"};
  const FN = {log:1, sin:1, cos:1, tan:1};
  function parse(s){
    let i = 0;
    function group(){ // {...} or single token
      while(s[i]===" ") i++;
      if(s[i]==="{"){ i++; const out=seq("}"); i++; return out; }
      if(s[i]==="@"){ return atom(); }
      const c=s[i++]; return tok(c);
    }
    function tok(c){
      if(c===undefined) return "";
      if(/[a-zA-Z]/.test(c)) return `<i>${c}</i>`;
      if(c==="-") return "−";
      if(c==="<") return "&lt;";
      if(c===">") return "&gt;";
      if(c==="&") return "&amp;";
      if(c===" ") return "";
      return c;
    }
    function scripts(base){
      let sup=null, sub=null;
      for(;;){
        if(s[i]==="^" && sup===null){ i++; sup=group(); continue; }
        if(s[i]==="_" && sub===null){ i++; sub=group(); continue; }
        break;
      }
      if(sup!==null && sub!==null) return base+`<span class="ss"><span>${sup}</span><span>${sub}</span></span>`;
      if(sup!==null) return base+`<sup>${sup}</sup>`;
      if(sub!==null) return base+`<sub>${sub}</sub>`;
      return base;
    }
    function atom(){
      // s[i] === "@"
      i++;
      if(s[i]==="["){ i++; return "<span class=\"bk\">[</span>"; }
      if(s[i]==="]"){ i++; return scripts("<span class=\"bk\">]</span>"); }
      let name=""; while(i<s.length && /[a-zA-Z]/.test(s[i])) name+=s[i++];
      if(name==="frac"){ const a=group(), b=group(); return `<span class="fr"><span>${a}</span><span>${b}</span></span>`; }
      if(name==="sqrt"){
        let idx="";
        if(s[i]==="["){ i++; idx=seq("]"); i++; }
        const a=group();
        return `<span class="rt">${idx?`<span class="ri">${idx}</span>`:""}<span class="rs">√</span><span class="ra">${a}</span></span>`;
      }
      if(name==="text"){ i++; let t=""; while(i<s.length && s[i]!=="}") t+=s[i++]; i++; return `<span class="tx">${t}</span>`; }
      if(name==="lim"){
        let sub=""; if(s[i]==="_"){ i++; sub=group(); }
        return `<span class="lim"><span>lim</span><span class="lu">${sub}</span></span>`;
      }
      if(name==="int"){
        let sup=null, sub=null;
        for(;;){ if(s[i]==="^"&&sup===null){i++; sup=group(); continue;} if(s[i]==="_"&&sub===null){i++; sub=group(); continue;} break; }
        const lim = (sup!==null||sub!==null) ? `<span class="il"><span>${sup||""}</span><span>${sub||""}</span></span>` : "";
        return `<span class="ig">∫</span>${lim}`;
      }
      if(FN[name]) return scripts(`<span class="fn">${name}</span>`)+"<span class=\"sp\"> </span>";
      if(SYM[name]) return scripts(SYM[name]);
      return name; // unknown: print as is
    }
    function seq(end){
      let out="";
      while(i<s.length && s[i]!==end){
        if(s[i]==="@"){ out+=scripts(atom()); continue; }
        if(s[i]==="{"){ i++; out+=seq("}"); i++; continue; }
        const c=s[i++];
        out+=scripts(tok(c));
      }
      return out;
    }
    return seq(undefined);
  }
  function render(str){
    if(str==null) return "";
    str=String(str);
    let out="", k=0;
    while(k<str.length){
      const a=str.indexOf("$",k);
      if(a<0){ out+=str.slice(k); break; }
      const b=str.indexOf("$",a+1);
      if(b<0){ out+=str.slice(k); break; }
      out+=str.slice(k,a)+`<span class="mx">${parse(str.slice(a+1,b))}</span>`;
      k=b+1;
    }
    return out;
  }
  return {render, parse};
})();


/* ===== 生徒の入力（式）を読んで値を出す =====
   使える文字：数字 . + − × ÷ / ^ ( ) √ π x C ² ³
   √ は直後の数・かっこ・π・x にかかる（√2/2 = (√2)/2、√(3)x = √3·x）。
   かけ算記号は省略してよい（2π、3x^2、2√3）。 */
const EXPR = (() => {
  function norm(s){
    return String(s).replace(/\s+/g,"")
      .replace(/[−ー－―‐]/g,"-").replace(/[＋]/g,"+").replace(/[×＊*]/g,"*").replace(/[÷／]/g,"/")
      .replace(/[（]/g,"(").replace(/[）]/g,")").replace(/[ｘＸX]/g,"x").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248))
      .replace(/．/g,".").replace(/²/g,"^2").replace(/³/g,"^3").replace(/sqrt/g,"√").replace(/pi/g,"π");
  }
  function tokenize(s){
    const t=[]; let i=0;
    while(i<s.length){
      const c=s[i];
      if(/[0-9.]/.test(c)){ let n=""; while(i<s.length && /[0-9.]/.test(s[i])) n+=s[i++]; if((n.match(/\./g)||[]).length>1) throw 0; t.push({k:"n",v:parseFloat(n)}); continue; }
      if("+-*/^()√πxC".includes(c)){ t.push({k:c}); i++; continue; }
      throw 0;
    }
    return t;
  }
  function compile(src){
    const t=tokenize(norm(src)); let p=0;
    const peek=()=>t[p], take=()=>t[p++];
    const startsPrimary=k=>k && (k.k==="n"||k.k==="("||k.k==="√"||k.k==="π"||k.k==="x"||k.k==="C");
    function expr(){ let a=term(); while(peek()&&(peek().k==="+"||peek().k==="-")){ const op=take().k, b=term(), L=a; a = op==="+" ? (x=>L(x)+b(x)) : (x=>L(x)-b(x)); } return a; }
    function term(){
      let a=unary();
      for(;;){
        const k=peek();
        if(k&&(k.k==="*"||k.k==="/")){ take(); const b=unary(), L=a; a = k.k==="*" ? (x=>L(x)*b(x)) : (x=>L(x)/b(x)); continue; }
        if(startsPrimary(k)){ const b=power(), L=a; a=x=>L(x)*b(x); continue; }
        return a;
      }
    }
    function unary(){ if(peek()&&peek().k==="-"){ take(); const a=unary(); return x=>-a(x); } if(peek()&&peek().k==="+"){ take(); return unary(); } return power(); }
    function power(){ const b=primary(); if(peek()&&peek().k==="^"){ take(); const e=unary(); return x=>Math.pow(b(x),e(x)); } return b; }
    function primary(){
      const k=take(); if(!k) throw 0;
      if(k.k==="n"){ const v=k.v; return ()=>v; }
      if(k.k==="π") return ()=>Math.PI;
      if(k.k==="x") return x=>x;
      if(k.k==="C") return ()=>0;
      if(k.k==="("){ const a=expr(); if(!peek()||take().k!==")") throw 0; return a; }
      if(k.k==="√"){ const a=power(); return x=>Math.sqrt(a(x)); }
      throw 0;
    }
    const f=expr(); if(p!==t.length) throw 0; return f;
  }
  function value(src, x){ try{ const v=compile(src)(x===undefined?1.2345:x); return Number.isFinite(v)?v:NaN; }catch(e){ return NaN; } }
  function close(a,b){ return Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a-b)<=1e-9*Math.max(1,Math.abs(b)); }
  const XS=[-1.7, -0.6, 0.35, 1.3, 2.71];
  /* 判定。opt.x=true なら x の式として比べる。opt.c=true なら「+C」が必要 */
  function same(input, ans, opt){
    opt=opt||{};
    let s=norm(input); if(!s) return {ok:false, empty:true};
    if(opt.c){
      if(!/\+C$/.test(s)) return {ok:false, noC:/C/.test(s)?false:true, bad:false, needC:true, core:checkCore(s.replace(/C/g,""),ans,opt)};
      s=s.replace(/\+C$/,"");
    }
    if(/C/.test(s)) return {ok:false};
    return {ok:checkCore(s,norm(ans).replace(/\+C$/,""),opt)};
  }
  function checkCore(s, a, opt){
    try{ compile(s); }catch(e){ return false; }
    if(opt.x) return XS.every(x=>close(value(s,x), value(a,x)));
    if(/x/.test(s)) return false;
    return close(value(s), value(a));
  }
  function valid(input){ try{ compile(input); return true; }catch(e){ return false; } }
  /* 入力の見た目（^ を上つきに） */
  function pretty(input){
    const s=String(input).replace(/\*/g,"×");
    let out="", i=0;
    const esc=c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]||c);
    while(i<s.length){
      const c=s[i];
      if(c==="^"){
        i++; let g="";
        if(s[i]==="("){ let d=0; do{ if(s[i]==="(")d++; if(s[i]===")")d--; g+=s[i++]; }while(i<s.length&&d>0); }
        else { if(s[i]==="-") g+=s[i++]; while(i<s.length&&/[0-9.xπ]/.test(s[i])) g+=s[i++]; }
        out+=`<sup>${g.split("").map(esc).join("")||"□"}</sup>`; continue;
      }
      if(c==="x"||c==="C") { out+=`<i>${c}</i>`; i++; continue; }
      if(c==="-") { out+="−"; i++; continue; }
      out+=esc(c); i++;
    }
    return out;
  }
  return {value, same, valid, pretty, norm, compile};
})();


/* ===== 動く図（ウィジェット） =====
   W.name(box) で box の中に図・スライダー・読み取り欄をつくる。
   座標は数学の向き（y が上）。色は CSS 変数（--c1 青, --c2 橙, --c3 緑, --c4 紫）。 */
const W = (() => {
  const R = s => TEX.render(s);
  const fx = (v, d=3) => { if(!Number.isFinite(v)) return "—"; const r=Math.round(v*10**d)/10**d; return (Object.is(r,-0)?0:r).toLocaleString("ja-JP",{maximumFractionDigits:d}).replace("-","−"); };

  function Plot(o){
    const w=o.w||340, h=o.h||240, pad=o.pad==null?22:o.pad;
    const {x0,x1,y0,y1}=o;
    const sx=x=>pad+(x-x0)/(x1-x0)*(w-2*pad), sy=y=>h-pad-(y-y0)/(y1-y0)*(h-2*pad);
    const P=[];
    const api={
      sx, sy, w, h,
      grid(dx,dy){ for(let x=Math.ceil(x0/dx)*dx;x<=x1+1e-9;x+=dx) P.push(`<line x1="${sx(x)}" y1="${sy(y0)}" x2="${sx(x)}" y2="${sy(y1)}" style="stroke:var(--grid)" stroke-width="1"/>`);
                   for(let y=Math.ceil(y0/dy)*dy;y<=y1+1e-9;y+=dy) P.push(`<line x1="${sx(x0)}" y1="${sy(y)}" x2="${sx(x1)}" y2="${sy(y)}" style="stroke:var(--grid)" stroke-width="1"/>`); return api; },
      axes(xl="x", yl="y"){
        if(y0<=0&&y1>=0) P.push(`<line x1="${sx(x0)}" y1="${sy(0)}" x2="${sx(x1)}" y2="${sy(0)}" style="stroke:var(--axis)" stroke-width="1.4"/>`, `<polygon points="${sx(x1)},${sy(0)} ${sx(x1)-7},${sy(0)-4} ${sx(x1)-7},${sy(0)+4}" style="fill:var(--axis)"/>`);
        if(x0<=0&&x1>=0) P.push(`<line x1="${sx(0)}" y1="${sy(y0)}" x2="${sx(0)}" y2="${sy(y1)}" style="stroke:var(--axis)" stroke-width="1.4"/>`, `<polygon points="${sx(0)},${sy(y1)} ${sx(0)-4},${sy(y1)+7} ${sx(0)+4},${sy(y1)+7}" style="fill:var(--axis)"/>`);
        if(xl&&y0<=0&&y1>=0) api.text(x1,0,xl,"var(--muted)",13,"end",-2,14,true);
        if(yl&&x0<=0&&x1>=0) api.text(0,y1,yl,"var(--muted)",13,"start",6,10,true);
        return api; },
      xt(list){ list.forEach(([v,l])=>{ P.push(`<line x1="${sx(v)}" y1="${sy(0)-3}" x2="${sx(v)}" y2="${sy(0)+3}" style="stroke:var(--axis)"/>`); api.text(v,0,l,"var(--muted)",11,"middle",0,15); }); return api; },
      yt(list){ list.forEach(([v,l])=>{ P.push(`<line x1="${sx(0)-3}" y1="${sy(v)}" x2="${sx(0)+3}" y2="${sy(v)}" style="stroke:var(--axis)"/>`); api.text(0,v,l,"var(--muted)",11,"end",-5,4); }); return api; },
      curve(f,color,width=2.5,opt={}){
        const a=opt.a==null?x0:opt.a, b=opt.b==null?x1:opt.b, n=opt.n||240; let d="", pen=false, prev=null;
        const lim=(y1-y0)*3;
        for(let k=0;k<=n;k++){ const x=a+(b-a)*k/n, y=f(x);
          const okk=Number.isFinite(y)&&y>y0-lim&&y<y1+lim && !(prev!==null && Math.abs(y-prev)>(y1-y0)*1.5);
          if(okk){ d+=(pen?"L":"M")+sx(x).toFixed(1)+" "+sy(y).toFixed(1)+" "; pen=true; } else pen=false;
          prev=Number.isFinite(y)?y:null; }
        P.push(`<path d="${d}" fill="none" style="stroke:${color}" stroke-width="${width}" stroke-linejoin="round" stroke-linecap="round" ${opt.dash?`stroke-dasharray="${opt.dash}"`:""}/>`); return api; },
      seg(xa,ya,xb,yb,color,width=2,dash){ P.push(`<line x1="${sx(xa)}" y1="${sy(ya)}" x2="${sx(xb)}" y2="${sy(yb)}" style="stroke:${color}" stroke-width="${width}" stroke-linecap="round" ${dash?`stroke-dasharray="${dash}"`:""}/>`); return api; },
      dot(x,y,color,r=5){ P.push(`<circle cx="${sx(x)}" cy="${sy(y)}" r="${r}" style="fill:${color}"/>`); return api; },
      ring(x,y,color,r=5){ P.push(`<circle cx="${sx(x)}" cy="${sy(y)}" r="${r}" style="fill:var(--surface);stroke:${color}" stroke-width="2"/>`); return api; },
      text(x,y,s,color,size=13,anchor="start",dx=0,dy=0,it){ P.push(`<text x="${sx(x)+dx}" y="${sy(y)+dy}" text-anchor="${anchor}" style="fill:${color};font-size:${size}px;font-family:var(--f-math);${it?"font-style:italic;":""}paint-order:stroke;stroke:var(--surface);stroke-width:3px">${s}</text>`); return api; },
      poly(pts,color,op=.25){ P.push(`<polygon points="${pts.map(([x,y])=>sx(x)+","+sy(y)).join(" ")}" style="fill:${color};fill-opacity:${op}"/>`); return api; },
      raw(s){ P.push(s); return api; },
      circle(cx,cy,r,color,width=2,dash){ P.push(`<ellipse cx="${sx(cx)}" cy="${sy(cy)}" rx="${Math.abs(sx(cx+r)-sx(cx))}" ry="${Math.abs(sy(cy+r)-sy(cy))}" fill="none" style="stroke:${color}" stroke-width="${width}" ${dash?`stroke-dasharray="${dash}"`:""}/>`); return api; },
      arc(cx,cy,r,t0,t1,color,width=2){ const n=Math.max(8,Math.ceil(Math.abs(t1-t0)/0.05)); let d=""; for(let k=0;k<=n;k++){ const t=t0+(t1-t0)*k/n; d+=(k?"L":"M")+sx(cx+r*Math.cos(t)).toFixed(1)+" "+sy(cy+r*Math.sin(t)).toFixed(1)+" "; } P.push(`<path d="${d}" fill="none" style="stroke:${color}" stroke-width="${width}" stroke-linecap="round"/>`); return api; },
      svg(){ return `<svg viewBox="0 0 ${w} ${h}" role="img">${P.join("")}</svg>`; }
    };
    return api;
  }

  function frame(box, title){
    const wg=el("div","wg"); wg.innerHTML=`<div class="wt">${title}</div>`;
    const fig=el("div"), ctl=el("div"), ro=el("div","ro");
    wg.append(fig, ctl, ro); box.appendChild(wg); return {wg, fig, ctl, ro};
  }
  function slider(label, min, max, step, val, fmt, on){
    const d=el("div","sl"); const id="s"+Math.random().toString(36).slice(2,8);
    d.innerHTML=`<label for="${id}">${label}</label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}"><output></output>`;
    const inp=d.querySelector("input"), out=d.querySelector("output");
    out.innerHTML=fmt(parseFloat(val));
    const upd=()=>{ const v=parseFloat(inp.value); out.innerHTML=fmt(v); on(v); };
    inp.addEventListener("input",()=>{ upd(); if(typeof touch==="function") touch(); });
    d.init=upd; return d;
  }
  function listSlider(label, vals, labs, idx, on){
    return slider(label, 0, vals.length-1, 1, idx, i=>labs[i], i=>on(vals[i], i));
  }
  function buttons(defs){ const d=el("div","wbtns"); defs.forEach(([t,f])=>{ const b=el("button",null,t); b.type="button"; b.addEventListener("click",()=>{ f(b); if(typeof touch==="function") touch(); }); d.appendChild(b); }); return d; }

  /* 角度の表示 */
  const PIF={0:"0",15:"@frac{@pi}{12}",30:"@frac{@pi}{6}",45:"@frac{@pi}{4}",60:"@frac{@pi}{3}",75:"@frac{5@pi}{12}",90:"@frac{@pi}{2}",105:"@frac{7@pi}{12}",120:"@frac{2@pi}{3}",135:"@frac{3@pi}{4}",150:"@frac{5@pi}{6}",165:"@frac{11@pi}{12}",180:"@pi",
    195:"@frac{13@pi}{12}",210:"@frac{7@pi}{6}",225:"@frac{5@pi}{4}",240:"@frac{4@pi}{3}",255:"@frac{17@pi}{12}",270:"@frac{3@pi}{2}",285:"@frac{19@pi}{12}",300:"@frac{5@pi}{3}",315:"@frac{7@pi}{4}",330:"@frac{11@pi}{6}",345:"@frac{23@pi}{12}",360:"2@pi"};
  const PIS={0:"0",30:"π/6",45:"π/4",60:"π/3",90:"π/2",120:"2π/3",135:"3π/4",150:"5π/6",180:"π",210:"7π/6",225:"5π/4",240:"4π/3",270:"3π/2",300:"5π/3",315:"7π/4",330:"11π/6",360:"2π"};
  const EX={0:["1","0"],30:["@frac{@sqrt3}{2}","@frac12"],45:["@frac{@sqrt2}{2}","@frac{@sqrt2}{2}"],60:["@frac12","@frac{@sqrt3}{2}"],90:["0","1"],
    120:["-@frac12","@frac{@sqrt3}{2}"],135:["-@frac{@sqrt2}{2}","@frac{@sqrt2}{2}"],150:["-@frac{@sqrt3}{2}","@frac12"],180:["-1","0"],
    210:["-@frac{@sqrt3}{2}","-@frac12"],225:["-@frac{@sqrt2}{2}","-@frac{@sqrt2}{2}"],240:["-@frac12","-@frac{@sqrt3}{2}"],270:["0","-1"],
    300:["@frac12","-@frac{@sqrt3}{2}"],315:["@frac{@sqrt2}{2}","-@frac{@sqrt2}{2}"],330:["@frac{@sqrt3}{2}","-@frac12"],360:["1","0"]};
  const piTicks=(n)=>{ const L=[[Math.PI/2,"π/2"],[Math.PI,"π"],[3*Math.PI/2,"3π/2"],[2*Math.PI,"2π"],[5*Math.PI/2,"5π/2"],[3*Math.PI,"3π"],[7*Math.PI/2,"7π/2"],[4*Math.PI,"4π"]]; return L.slice(0,n); };
  const rad=d=>d*Math.PI/180;

  const lib = {};

  /* 1 紙を折る */
  lib.fold = box => {
    const F=frame(box,"紙を折ってみよう（厚さ 0.1mm）"); let n=0;
    const marks=[[1,"1mm"],[20,"消しゴム"],[1700,"人の身長"],[333000,"東京タワー"],[3776000,"富士山"],[8849000,"エベレスト"],[400e6,"宇宙ステーション"],[384400e6,"月"]];
    const fmtLen=mm=> mm<10?fx(mm,2)+" mm": mm<1000?fx(mm/10,1)+" cm": mm<1e6?fx(mm/1000,1)+" m": fx(mm/1e6,0)+" km";
    function draw(){
      const mm=0.1*2**n;
      const p=Plot({w:340,h:270,x0:0,x1:10,y0:-1.4,y1:12.4,pad:10});
      p.seg(3,-1,3,12,"var(--axis)",1.5);
      for(let e=-1;e<=12;e++) p.seg(2.8,e,3.2,e,"var(--axis)",1);
      p.text(3,-1,"0.1mm","var(--muted)",10,"end",-8,4);
      let lastY=-9;
      marks.forEach(([v,l])=>{ const y=Math.log10(v); const past=mm>=v; const ly=Math.max(y,lastY+0.85); lastY=ly;
        p.seg(3,y,3.5,y,past?"var(--c3)":"var(--axis)",1.5); if(ly!==y) p.seg(3.5,y,3.8,ly,past?"var(--c3)":"var(--axis)",1);
        p.text(3.9,ly,l,past?"var(--c3)":"var(--muted)",12,"start",0,4); });
      const y=Math.log10(mm);
      p.raw(`<rect x="${p.sx(1.2)}" y="${p.sy(y)}" width="${p.sx(2.6)-p.sx(1.2)}" height="${p.sy(-1)-p.sy(y)}" rx="3" style="fill:var(--c2);fill-opacity:.85"/>`);
      p.text(1.9,Math.min(y,12),n+"回","var(--c2)",13,"middle",0,-6);
      p.text(9.8,12,"目もり1つで10倍","var(--muted)",10,"end");
      F.fig.innerHTML=p.svg();
      let past=marks.filter(([v])=>mm>=v).pop();
      F.ro.innerHTML=`折った回数 <span class="big">${n}</span> 回　厚さ <span class="big">${fmtLen(mm)}</span><br>はじめの <b>${(2**n).toLocaleString("ja-JP")}</b> 倍${past?`　<b style="color:var(--c3)">${past[1]}</b>をこえた！`:""}`;
    }

    F.ctl.appendChild(listSlider("a =",V.map((_,j)=>j),L,ia,j=>{ia=j; draw();}));
    F.ctl.appendChild(listSlider("b =",V.map((_,j)=>j),L,ib,j=>{ib=j; draw();}));
    draw();
  };

  /* 14 落下するボール：平均の速さ */
  lib.drop = box => {
    const F=frame(box,"ボールを落とす：t 秒で 5t² m 落ちる"); const H=[1,0.5,0.1,0.01,0.001]; let hi=0;
    function draw(){
      const h=H[hi], f=t=>5*t*t;
      const p=Plot({w:340,h:230,x0:-0.15,x1:2.25,y0:-1.5,y1:24,pad:16});
      p.grid(0.5,5).axes("t","y").xt([[1,"1"],[2,"2"]]).yt([[5,"5"],[10,"10"],[20,"20"]]);
      p.curve(f,"var(--c1)",2.5,{a:0,b:2.2});
      const m=(f(1+h)-f(1))/h;
      p.curve(t=>f(1)+m*(t-1),"var(--c2)",2,{a:0.3,b:2.2,dash:h<0.01?"":"6 4"});
      p.dot(1,5,"var(--ink)",5); p.dot(1+h,f(1+h),"var(--c2)",5);
      F.fig.innerHTML=p.svg();
      const rows=H.slice(0,hi+1).map(x=>`<tr><td>${fx(1+x,3)}</td><td>${fx(f(1+x)-5,5)}</td><td>${fx(x,3)}</td><td><b>${fx((f(1+x)-5)/x,4)}</b></td></tr>`).join("");
      F.ro.innerHTML=`<table><tr><th>終わりの t</th><th>落ちた<br>きょり</th><th>かかった<br>時間</th><th>平均の<br>速さ</th></tr>${rows}</table>t=1 秒から ${fx(1+h,3)} 秒までの平均の速さ <span class="big">${fx(m,4)}</span> m/秒`;
    }
    F.ctl.appendChild(listSlider("時間 h",H.map((_,j)=>j),H.map(x=>fx(x,3)+"秒"),hi,j=>{hi=j; draw();}));
    draw();
  };

  /* 15 割線から接線へ */
  lib.secant = box => {
    const F=frame(box,"y = x² の2点 A, B を結ぶ直線の傾き"); let h=2;
    function draw(){
      const f=x=>x*x, a=1, m=(f(a+h)-f(a))/h;
      const p=Plot({w:340,h:240,x0:-1.2,x1:3.4,y0:-1.2,y1:10.4,pad:14});
      p.grid(1,1).axes().xt([[1,"1"],[2,"2"],[3,"3"]]).yt([[1,"1"],[4,"4"],[9,"9"]]);
      p.curve(f,"var(--c1)",2.5);
      p.curve(x=>f(a)+m*(x-a),"var(--c2)",2.2);
      p.dot(a,1,"var(--ink)",5).text(a,1,"A","var(--ink)",13,"end",-6,-6,true);
      p.dot(a+h,f(a+h),"var(--c2)",5).text(a+h,f(a+h),"B","var(--c2)",13,"start",7,4,true);
      F.fig.innerHTML=p.svg();
      F.ro.innerHTML=`A(1, 1)，B(${fx(1+h,2)}, ${fx(f(1+h),4)})<br>傾き ＝ ${R("$@frac{f(1+h)-f(1)}{h}$")} ＝ <span class="big">${fx(m,4)}</span>${h<0.05?"　← B が A にくっつく：<b>接線の傾き</b>に近づく":""}`;
    }
    F.ctl.appendChild(slider("h =",0.01,2,0.01,h,v=>fx(v,2),v=>{h=v; draw();}));
    draw();
  };

  /* 16 傾きのグラフ（導関数）をかく */
  lib.slopegraph = box => {
    const F=frame(box,"傾きを記録すると、もう1つのグラフができる");
    const FS={"x²":[x=>x*x,x=>2*x],"x³":[x=>x**3,x=>3*x*x],"x":[x=>x,x=>1]}; let key="x²", x0=-2;
    function draw(){
      const [f,df]=FS[key];
      const p=Plot({w:340,h:260,x0:-2.4,x1:2.4,y0:-5,y1:8.5,pad:14});
      p.grid(1,1).axes().xt([[-2,"−2"],[-1,"−1"],[1,"1"],[2,"2"]]).yt([[2,"2"],[4,"4"],[-2,"−2"],[-4,"−4"]]);
      p.curve(f,"var(--c1)",2.5,{a:-2.4,b:2.4});
      p.curve(df,"var(--c2)",3,{a:-2,b:x0});
      const m=df(x0); p.curve(x=>f(x0)+m*(x-x0),"var(--c1)",1.5,{a:x0-0.8,b:x0+0.8,dash:"4 3"});
      p.dot(x0,f(x0),"var(--c1)",5); p.dot(x0,m,"var(--c2)",5); p.seg(x0,f(x0),x0,m,"var(--muted)",1,"2 3");
      F.fig.innerHTML=p.svg();
      F.ro.innerHTML=`<span style="color:var(--c1)">青</span>：y=${key}　x=${fx(x0,1)} での接線の傾き <b>${fx(m,2)}</b><br><span style="color:var(--c2)">橙</span>：傾きの記録（x, 傾き）→ これが<b>導関数</b>のグラフ`;
    }
    F.ctl.appendChild(buttons(Object.keys(FS).map(k=>["y="+k,b=>{ key=k; b.parentNode.querySelectorAll("button").forEach(z=>z.classList.toggle("on",z===b)); draw(); }])));
    F.ctl.querySelector("button").classList.add("on");
    F.ctl.appendChild(slider("x =",-2,2,0.1,x0,v=>fx(v,1),v=>{x0=v; draw();}));
    draw();
  };

  /* 17 接線 */
  lib.tangent = box => {
    const F=frame(box,"y = x² の接線（接点を動かそう）"); let a=1;
    function draw(){
      const p=Plot({w:340,h:240,x0:-3.2,x1:3.2,y0:-3,y1:9.4,pad:14});
      p.grid(1,1).axes().xt([[-2,"−2"],[1,"1"],[2,"2"],[3,"3"]]).yt([[1,"1"],[4,"4"],[-2,"−2"]]);
      p.curve(x=>x*x,"var(--c1)",2.5);
      p.curve(x=>2*a*x-a*a,"var(--c2)",2.5);
      p.dot(a,a*a,"var(--ink)",5.5);
      F.fig.innerHTML=p.svg();
      const b=-a*a;
      F.ro.innerHTML=`接点 (${fx(a,1)}, ${fx(a*a,2)})　傾き f′(${fx(a,1)}) = ${fx(2*a,1)}<br>接線 <span class="big">y = ${fx(2*a,1)}x ${b<0?"− "+fx(-b,2):"+ "+fx(b,2)}</span>`;
    }
    F.ctl.appendChild(slider("a =",-2,3,0.5,a,v=>fx(v,1),v=>{a=v; draw();}));
    draw();
  };

  /* 18 増減（上り・下り） */
  lib.updown = box => {
    const F=frame(box,"y = x³ − 3x の上り・下り"); let x0=-2;
    function draw(){
      const f=x=>x**3-3*x, df=x=>3*x*x-3, m=df(x0);
      const p=Plot({w:340,h:250,x0:-2.5,x1:2.5,y0:-3.4,y1:3.4,pad:14});
      p.grid(1,1).axes().xt([[-2,"−2"],[-1,"−1"],[1,"1"],[2,"2"]]).yt([[2,"2"],[-2,"−2"]]);
      p.curve(f,"var(--grid)",2.5,{a:-2.3,b:2.3});
      p.curve(f,"var(--c1)",3,{a:-2.3,b:x0});
      const col= Math.abs(m)<1e-9?"var(--c4)":m>0?"var(--c3)":"var(--c2)";
      p.curve(x=>f(x0)+m*(x-x0),col,2.5,{a:x0-0.6,b:x0+0.6});
      p.dot(x0,f(x0),col,6);
      F.fig.innerHTML=p.svg();
      const st= Math.abs(m)<1e-9?`<b style="color:var(--c4)">傾き 0（${x0<0?"山のてっぺん：極大":"谷底：極小"}）</b>`: m>0?`<b style="color:var(--c3)">上り（傾き＋）</b>`:`<b style="color:var(--c2)">下り（傾き−）</b>`;
      F.ro.innerHTML=`x = ${fx(x0,1)}　y = ${fx(f(x0),3)}　傾き f′(x) = ${fx(m,2)}<br>${st}`;
    }
    F.ctl.appendChild(slider("x =",-2.2,2.2,0.1,x0,v=>fx(v,1),v=>{x0=Math.round(v*10)/10; draw();}));
    draw();
  };

  /* 19 箱の体積 */
  lib.box = box => {
    const F=frame(box,"12cm四方の紙から箱をつくる"); let x=1;
    function draw(){
      const V=x*(12-2*x)**2;
      const s=10; // 図の縮尺
      let g=`<svg viewBox="0 0 340 170" role="img"><g transform="translate(10,10)">`;
      g+=`<rect x="0" y="0" width="${12*s}" height="${12*s}" style="fill:color-mix(in srgb,var(--c1) 22%,var(--surface));stroke:var(--axis)"/>`;
      [[0,0],[12-x,0],[0,12-x],[12-x,12-x]].forEach(([a,b])=>{ g+=`<rect x="${a*s}" y="${b*s}" width="${x*s}" height="${x*s}" style="fill:var(--surface);stroke:var(--c2)" stroke-dasharray="3 2"/>`; });
      g+=`<rect x="${x*s}" y="${x*s}" width="${(12-2*x)*s}" height="${(12-2*x)*s}" style="fill:var(--surface);stroke:var(--c1)" stroke-width="1.5"/>`;
      g+=`<text x="${6*s}" y="${6*s+4}" text-anchor="middle" style="fill:var(--c1);font-size:11px">底</text><text x="${6*s}" y="${x*s/2+4}" text-anchor="middle" style="fill:var(--muted);font-size:10px">${x>=1.2?"折る":""}</text>`;
      g+=`<text x="${6*s}" y="${12*s+16}" text-anchor="middle" style="fill:var(--muted);font-size:12px">底 ${fx(12-2*x,1)} cm 四方，高さ ${fx(x,1)} cm</text></g>`;
      // V のグラフ
      const p=Plot({w:190,h:150,x0:0,x1:6,y0:0,y1:140,pad:12});
      p.curve(t=>t*(12-2*t)**2,"var(--c1)",2.2,{a:0,b:6}); p.axes("x","V"); p.dot(x,V,"var(--c2)",5);
      g+=`<g transform="translate(150,10)">${p.svg().replace(/<svg[^>]*>|<\/svg>/g,"")}</g></svg>`;
      F.fig.innerHTML=g;
      F.ro.innerHTML=`切り取る長さ x = <b>${fx(x,1)}</b> cm　体積 V = ${fx(x,1)}×${fx(12-2*x,1)}² = <span class="big">${fx(V,1)}</span> cm³`;
    }
    F.ctl.appendChild(slider("x =",0.5,5.5,0.1,x,v=>fx(v,1),v=>{x=Math.round(v*10)/10; draw();}));
    draw();
  };

  /* 20 +C：上下にずらしても傾きは同じ */
  lib.slidec = box => {
    const F=frame(box,"y = x² + C（C を動かそう）"); let C=0;
    function draw(){
      const p=Plot({w:340,h:240,x0:-2.6,x1:2.6,y0:-3.6,y1:8.4,pad:14});
      p.grid(1,1).axes().xt([[-2,"−2"],[-1,"−1"],[1,"1"],[2,"2"]]).yt([[2,"2"],[4,"4"],[-2,"−2"]]);
      [-3,-1.5,1.5,3].forEach(c=>p.curve(x=>x*x+c,"var(--grid)",1.5));
      p.curve(x=>x*x+C,"var(--c1)",3);
      p.curve(x=>1+C+2*(x-1),"var(--c2)",2,{a:0,b:2.2}); p.dot(1,1+C,"var(--c2)",5);
      F.fig.innerHTML=p.svg();
      F.ro.innerHTML=`${R(`$y=x^2${C===0?"":C>0?"+"+fx(C,1):"-"+fx(-C,1)}$`)}　x=1 での傾き <span class="big">2</span>（C を変えても同じ）<br>微分すると、どれも ${R("$2x$")}。`;
    }
    F.ctl.appendChild(slider("C =",-3,3,0.5,C,v=>fx(v,1),v=>{C=v; draw();}));
    draw();
  };

  /* 21 短冊で面積 */
  lib.riemann = box => {
    const F=frame(box,"y = x² の下（0≦x≦3）を短冊でうめる"); let n=3;
    function draw(){
      const f=x=>x*x, a=0, b=3, w=(b-a)/n;
      const p=Plot({w:340,h:240,x0:-0.3,x1:3.4,y0:-0.8,y1:9.8,pad:14});
      p.grid(1,1).axes().xt([[1,"1"],[2,"2"],[3,"3"]]).yt([[1,"1"],[4,"4"],[9,"9"]]);
      let S=0;
      for(let k=1;k<=n;k++){ const xr=a+k*w, h=f(xr); S+=h*w; p.poly([[xr-w,0],[xr,0],[xr,h],[xr-w,h]],"var(--c2)",.28); if(n<=30) p.raw(`<rect x="${p.sx(xr-w)}" y="${p.sy(h)}" width="${p.sx(xr)-p.sx(xr-w)}" height="${p.sy(0)-p.sy(h)}" style="fill:none;stroke:var(--c2)" stroke-width="1"/>`); }
      p.curve(f,"var(--c1)",2.5,{a:0,b:3.1});
      F.fig.innerHTML=p.svg();
      F.ro.innerHTML=`短冊 <b>${n}</b> 本　面積の合計 <span class="big">${fx(S,4)}</span>`;
    }
    F.ctl.appendChild(slider("本数",1,200,1,n,v=>v+"本",v=>{n=v; draw();}));
    draw();
  };

  return lib;
})();

/* ===== 手書きの計算メモ =====
   回の画面の右下に「✏️ メモ」。押すと画面の下半分に方眼の手書きスペースが出る（上半分の問題は見えたまま）。
   線は回ごとにこの端末に保存（記録としては送らない）。キーパッドとは同時に出さない。 */
const MEMO = (() => {
  const KEYP = "nattoku2.memo.";
  let fab=null, panel=null, cv=null, ctx=null, lessonId=null, strokes=[], cur=null, mode="pen", big=false, clearArm=0;

  function load(id){ try{ return JSON.parse(localStorage.getItem(KEYP+id)||"[]"); }catch(e){ return []; } }
  function store(){ if(!lessonId) return; try{ localStorage.setItem(KEYP+lessonId, JSON.stringify(strokes)); }catch(e){} }

  function build(){
    fab=el("button","memofab","✏️ メモ"); fab.type="button"; fab.setAttribute("aria-label","計算メモをひらく");
    fab.addEventListener("click",e=>{ e.stopPropagation(); show(); });
    panel=el("div","memo");
    panel.innerHTML=`<div class="mbar">
      <button type="button" data-a="pen" class="on">✏️ ペン</button><button type="button" data-a="eraser">🧽 けす</button>
      <button type="button" data-a="undo">↶ もどす</button><button type="button" data-a="clear">全部けす</button>
      <button type="button" data-a="size" aria-label="大きさを変える">⇕</button><button type="button" data-a="close" class="mclose">とじる</button></div>
      <div class="mcv"><canvas></canvas></div>`;
    cv=panel.querySelector("canvas"); ctx=cv.getContext("2d");
    panel.addEventListener("click",e=>e.stopPropagation());
    panel.querySelectorAll(".mbar button").forEach(b=>b.addEventListener("click",()=>act(b.dataset.a,b)));
    cv.addEventListener("pointerdown",down); cv.addEventListener("pointermove",move);
    ["pointerup","pointercancel","pointerleave"].forEach(t=>cv.addEventListener(t,up));
    document.body.append(fab, panel);
    window.addEventListener("resize",()=>{ if(panel.classList.contains("on")) fit(); });
  }
  function act(a,b){
    if(a==="pen"||a==="eraser"){ mode=a; panel.querySelectorAll('[data-a="pen"],[data-a="eraser"]').forEach(x=>x.classList.toggle("on",x===b)); }
    else if(a==="undo"){ strokes.pop(); store(); redraw(); }
    else if(a==="clear"){
      if(Date.now()-clearArm<3000){ strokes=[]; store(); redraw(); clearArm=0; b.textContent="全部けす"; }
      else { clearArm=Date.now(); b.textContent="もう一度"; setTimeout(()=>{ if(b.textContent!=="全部けす"&&Date.now()-clearArm>=2900) b.textContent="全部けす"; },3000); }
    }
    else if(a==="size"){ big=!big; panel.classList.toggle("big",big); fit(); }
    else if(a==="close") hide();
    if(typeof touch==="function") touch();
  }
  function fit(){
    const box=panel.querySelector(".mcv"), r=box.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); cv.style.width=r.width+"px"; cv.style.height=r.height+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0); redraw();
    const w=document.querySelector(".wrap"); if(w) w.style.paddingBottom=(panel.offsetHeight+24)+"px";
  }
  /* 点は「キャンバス幅を1」とした座標で保存（画面の向きが変わってもくずれない） */
  function W(){ return cv.clientWidth||1; }
  function line(s){
    if(!s.p.length) return;
    const k=W();
    ctx.save();
    ctx.globalCompositeOperation = s.m==="eraser" ? "destination-out" : "source-over";
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#222";
    ctx.lineWidth = s.m==="eraser" ? 22 : 2.6; ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.beginPath(); ctx.moveTo(s.p[0][0]*k, s.p[0][1]*k);
    if(s.p.length===1) ctx.lineTo(s.p[0][0]*k+0.1, s.p[0][1]*k);
    for(let i=1;i<s.p.length;i++) ctx.lineTo(s.p[i][0]*k, s.p[i][1]*k);
    ctx.stroke(); ctx.restore();
  }
  function redraw(){ ctx.clearRect(0,0,cv.width,cv.height); strokes.forEach(line); }
  function pt(e){ const r=cv.getBoundingClientRect(), k=W(); return [Math.round((e.clientX-r.left)/k*1000)/1000, Math.round((e.clientY-r.top)/k*1000)/1000]; }
  function down(e){ e.preventDefault(); cv.setPointerCapture&&cv.setPointerCapture(e.pointerId); cur={m:mode,p:[pt(e)]}; strokes.push(cur); line(cur); }
  function move(e){
    if(!cur) return; e.preventDefault();
    const q=pt(e), last=cur.p[cur.p.length-1], k=W();
    if(Math.hypot((q[0]-last[0])*k,(q[1]-last[1])*k)<1.5) return;
    cur.p.push(q);
    const k2=W(); ctx.save(); ctx.globalCompositeOperation= cur.m==="eraser"?"destination-out":"source-over";
    ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#222";
    ctx.lineWidth= cur.m==="eraser"?22:2.6; ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.beginPath(); ctx.moveTo(last[0]*k2,last[1]*k2); ctx.lineTo(q[0]*k2,q[1]*k2); ctx.stroke(); ctx.restore();
  }
  function up(){ if(!cur) return; cur=null; store(); if(typeof touch==="function") touch(); }

  function show(){
    if(typeof hideKP==="function") hideKP();
    panel.classList.add("on"); fab.classList.add("hid"); fit();
  }
  function hide(){
    if(!panel) return;
    panel.classList.remove("on"); if(lessonId) fab.classList.remove("hid");
    const w=document.querySelector(".wrap"); if(w) w.style.paddingBottom="";
  }
  /* 回を開いたとき・もくじにもどったとき */
  function enter(id){ if(!fab) build(); hide(); lessonId=id; strokes=load(id); fab.classList.remove("hid"); fab.style.display=""; }
  function leave(){ if(!fab) return; hide(); lessonId=null; fab.style.display="none"; }
  function isOpen(){ return !!panel && panel.classList.contains("on"); }
  function setFab(visible){ if(fab && lessonId) fab.classList.toggle("hid", !visible || isOpen()); }
  return {enter, leave, hide, show, isOpen, setFab};
})();

/* ===== 「なんで？」：問いを立てて、AI（と北野先生）から返事をもらう =====
   問いと返事は回ごとに LS(id).qa に残す。北野先生の返事は replies で取りに行く。 */
const ASK = (() => {
  const TYPES = [["なぜ〜？","なんで"],["〜でないとどうなる？","もし〜でなかったら、どうなる？"],["〜と〜はどこがちがう？","〜と〜は、どこがちがう？"],["いつでも成り立つ？","これは、いつでも成り立つ？"]];
  let lastPull = 0;

  function bubble(item, noNext){
    const b=el("div","qa");
    b.innerHTML=`<div class="qq"><span>🤔</span>${esc(item.q)}</div>`;
    const a=el("div","qr");
    if(item.pending){ a.innerHTML=`<span class="dots">考え中</span>`; }
    else if(item.err){ a.innerHTML=`<p>${esc(item.err)}</p>`; }
    else if(!item.answer){ a.innerHTML=`<p>📮 問いは北野先生に届いたよ。返事を待つあいだに、自分で調べてみよう。</p>`; }
    else {
      a.innerHTML = (item.kind?`<div class="qk">${esc(item.kind)}</div>`:"") + `<p>${esc(item.answer||"")}</p>` +
        (item.check?`<div class="qc"><b>確かめてみよう</b>　${esc(item.check)}</div>`:"");
    }
    b.appendChild(a);
    if(!item.pending && !item.err){
      const g=el("a","gbtn",item.answer?"🔍 もっと調べる（Google の AI モード）":"🔍 Google の AI モードで調べる");
      g.href=googleUrl(item.q, item.title||""); g.target="_blank"; g.rel="noopener";
      g.addEventListener("click",()=>{ item.searched=true; save(); touch(); });
      b.appendChild(g);
      if(!noNext && item.id){
        const w=el("div","qnote");
        w.innerHTML=`<small>調べてわかったことを一言（北野先生に届く）</small>`;
        const t=el("textarea"); t.value=item.found||""; t.maxLength=300; t.rows=2; t.placeholder="例：ラジアンだと弧の長さが r×θ だけで出せる";
        const sb=el("button","go sub","送る"); sb.type="button"; const f=el("div","fb");
        sb.addEventListener("click",async()=>{
          const v=t.value.trim(); if(v.length<3){ fbSet(f,false,"一言でいいので書いてみよう"); return; }
          sb.disabled=true;
          try{ const r=await fetch(SUBMIT_URL+"?mode=note&id="+encodeURIComponent(item.id)+"&dev="+encodeURIComponent(ST.dev)+"&text="+encodeURIComponent(v)); const d=await r.json();
               if(d.ok){ item.found=v; save(); fbSet(f,true,"○ 送ったよ。問い→調べる→まとめる、ができた！"); } else fbSet(f,false,d.msg||"送れなかった"); }
          catch(e){ fbSet(f,false,"つながらなかった。もう一度押してね"); }
          sb.disabled=false; touch();
        });
        w.append(t, sb, f); if(item.found) fbSet(f,true,"送ったもの：" + esc(item.found));
        b.appendChild(w);
      } else if(item.found){ b.appendChild(el("div","qt qf",`<b>調べてわかったこと</b>${esc(item.found)}`)); }
    }
    if(item.teacher){ b.appendChild(el("div","qt",`<b>北野先生から</b>${esc(item.teacher)}`)); }
    if(!noNext && item.next && item.next.length && !item.pending){
      const n=el("div","qn",`<small>つぎの問いにしてみる？（タップすると下の欄に入る）</small>`);
      item.next.forEach(t=>{ const c=el("button","chip",esc(t)); c.type="button"; c.addEventListener("click",()=>{ const ta=document.getElementById("askta"); if(ta){ ta.value=t; ta.focus(); ta.scrollIntoView({behavior:"smooth",block:"center"}); } }); n.appendChild(c); });
      b.appendChild(n);
    }
    return b;
  }

  /* Google の AI モードを、問いと「答え方の注文」をつけて開く（udm=50 は AI モードを開く値。公式の仕様ではない） */
  function googleUrl(q, title){
    const pre = `高校数学Ⅱ${title?"「"+title+"」":""}で出てきた疑問：${q}　高校生にわかるように、数学Ⅱの範囲で言える理由を先に、短く説明してください。最後に、自分で確かめられる小さな問題を1つ出してください。`;
    return "https://www.google.com/search?udm=50&q=" + encodeURIComponent(pre);
  }

  /* 回の「ふりかえり」の中に置くカード */
  function card(){
    const st=LS(cur.id); st.qa=st.qa||[];
    const c=el("div","card askcard");
    c.innerHTML=`<div class="q">🤔 「なんで？」と思ったことを1文で</div>
      <small class="asknote">モヤモヤを「問い」にしてみよう。問いは北野先生に届く。そのあと Google の AI モードで自分で調べられる。名前や住所は書かないでね。</small>
      <div class="qtypes"></div>`;
    const ty=c.querySelector(".qtypes");
    TYPES.forEach(([lab,stub])=>{ const b=el("button","chip",lab); b.type="button"; b.addEventListener("click",()=>{ ta.value = stub==="なんで" ? "なんで" : stub; ta.focus(); }); ty.appendChild(b); });
    const ta=el("textarea"); ta.id="askta"; ta.maxLength=300; ta.placeholder="例：なんでラジアンが必要なの？"; ta.value=st.texts.askdraft||"";
    ta.addEventListener("input",()=>{ st.texts.askdraft=ta.value; touch(); });
    const go=el("button","go","きいてみる"); go.type="button";
    const fb=el("div","fb");
    const list=el("div","qalist");
    const paint=()=>{ list.innerHTML=""; st.qa.slice().reverse().forEach(it=>list.appendChild(bubble(it))); };
    go.addEventListener("click",async()=>{
      const q=ta.value.trim();
      if(q.length<4){ fbSet(fb,false,"もう少しくわしく書いてみよう（どこが、なんで？）"); return; }
      if(!ST.nick){ fbSet(fb,false,"もくじにもどって、ニックネームを入れてから聞こう。"); return; }
      fb.className="fb"; fb.textContent="";
      const item={q, pending:true, t:Date.now(), title:cur.title.replace(/\$|@[a-z]+|[{}]/g,"")}; st.qa.push(item); save(); paint(); go.disabled=true;
      try{
        const url=SUBMIT_URL+"?"+Object.entries({mode:"ask", q, nick:ST.nick, dev:ST.dev, lesson:cur.no, title:cur.title.replace(/\$|@/g,""), goal:cur.goal.replace(/\$|@[a-z]+|[{}]/g,"")}).map(([k,v])=>k+"="+encodeURIComponent(String(v).slice(0,300))).join("&");
        const r=await fetch(url,{method:"GET"}); const d=await r.json();
        delete item.pending;
        if(d.ok){ Object.assign(item,{id:d.id, kind:d.kind, answer:d.answer, check:d.check, next:d.next||[], human:!!d.human}); ta.value=""; st.texts.askdraft=""; }
        else if(d.limit){ item.err=d.msg; }
        else { st.qa.pop(); fbSet(fb,false,d.msg||"うまく送れなかった。もう一度ためしてね。"); }
      }catch(e){ delete item.pending; st.qa.pop(); fbSet(fb,false,"つながらなかった。電波のいいところで、もう一度「きいてみる」を押してね。"); }
      go.disabled=false; save(); paint(); touch();
    });
    c.append(ta, go, fb, list); paint();
    pull();
    return c;
  }

  /* 北野先生の返事を取りに行く（1分に1回まで） */
  async function pull(force){
    if(!SUBMIT_URL || !ST.dev) return;
    const hasQ = Object.values(ST.lessons).some(l=>(l.qa||[]).some(x=>x.id));
    if(!hasQ) return;
    if(!force && Date.now()-lastPull<60000) return; lastPull=Date.now();
    try{
      const r=await fetch(SUBMIT_URL+"?mode=replies&dev="+encodeURIComponent(ST.dev)); const d=await r.json();
      if(!d.ok) return; let changed=false;
      (d.items||[]).forEach(x=>{ Object.values(ST.lessons).forEach(l=>(l.qa||[]).forEach(it=>{ if(it.id===x.id && it.teacher!==x.reply){ it.teacher=x.reply; it.unread=true; changed=true; } })); });
      if(changed){ save(); if(cur){ const box=document.querySelector(".askcard"); if(box){ const nc=card(); box.replaceWith(nc); } } else if(document.getElementById("myq")) home(); toast("北野先生から返事がきたよ", 3000); }
    }catch(e){}
  }

  function count(){ let n=0, unread=0; Object.values(ST.lessons).forEach(l=>(l.qa||[]).forEach(x=>{ if(!x.err){ n++; if(x.unread) unread++; } })); return {n, unread}; }

  /* もくじから開く「わたしの問い」 */
  function page(){
    hideKP(); MEMO.leave(); cur=null;
    const rows=[]; LESSONS.forEach(les=>{ (LS(les.id).qa||[]).forEach(x=>{ if(!x.err) rows.push([les,x]); }); });
    app.innerHTML=`<div class="bar"><button class="back" id="bk">← もくじ</button><span class="ttl">🤔 わたしの問い</span><span class="sc">${rows.length} こ</span></div>
      <p class="note" style="margin-top:0">これまでに立てた問い。問いがふえるほど、数学が「自分のもの」になっていく。</p><div id="ql"></div>`;
    document.getElementById("bk").addEventListener("click",home);
    const box=document.getElementById("ql");
    if(!rows.length) box.appendChild(el("p","note","まだない。各回の最後の「なんで？」で聞いてみよう。"));
    rows.reverse().forEach(([les,x])=>{ const h=el("div","qhead",`第${les.no}回　${R(les.title)}`); box.append(h, bubble(x, true)); x.unread=false; });
    save(); window.scrollTo(0,0);
  }
  return {card, pull, count, page};
})();

/* ===== 設定：Apps Script の URL を入れると「記録を送る」ボタンが出る ===== */
const SUBMIT_URL = "https://script.google.com/macros/s/AKfycbyFprEEbZe4hGuYo3PKCIv9PLeFSYhmJrlnh-3UfYOD4L40W3OQDYZalRP9y5EBbBsQYg/exec";   /* 例: "https://script.google.com/macros/s/XXXX/exec" */

function touch(){ if(!cur) return; const st=LS(cur.id), now=Date.now(); if(st.last) st.active=(st.active||0)+Math.min(now-st.last,120000); st.last=now; save(); }

const R = s => TEX.render(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }

const TAGC = {"見る":"--t1","手を動かす":"--t2","考える":"--t3","解く":"--t4","ふりかえり":"--t5"};

/* 判定の単位を数える */
LESSONS.forEach(les=>{ let k=0; les.secs.forEach(sec=>sec.items.forEach(it=>{
  it.id=les.id+"-"+(k++);
  it.units = it.t==="cls" ? it.rows.length : ["choice","multi","fill"].includes(it.t) ? 1 : 0;
})); les.total=les.secs.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.units,0),0); });

function unitKeys(it){ if(it.t==="cls") return it.rows.map((_,i)=>it.id+"."+i); return it.units?[it.id]:[]; }
function stats(les){
  const st=LS(les.id); let done=0, first=0, shown=0, tries=0;
  les.secs.forEach(s=>s.items.forEach(it=>unitKeys(it).forEach(k=>{ const r=st.items[k]; if(r){ tries+=r.tries||0; if(r.ok){ done++; if(r.first) first++; if(r.shown) shown++; } } })));
  return {done, first, shown, tries, total:les.total, minutes:Math.round((st.active||0)/60000)};
}
function needsSend(les){ if(!SUBMIT_URL) return false; const s=stats(les), st=LS(les.id); return s.done>0 && (!st.sentAt || s.done>(st.sentDone||0)); }
function stars(s){ if(s.done<s.total) return 0; const f=s.first/s.total; if(s.shown===0 && f>=0.9) return 3; if(f>=0.7) return 2; return 1; }

let cur=null, streak=0;
function mark(key, ok, shown){
  const st=LS(cur.id); const r=st.items[key] || (st.items[key]={ok:false, tries:0, first:false});
  if(r.ok) return r;
  if(shown){ r.ok=true; r.shown=true; streak=0; }
  else { r.tries++; if(ok){ r.ok=true; r.first=r.tries===1; streak = r.first ? streak+1 : 0; if(r.first && (streak===5||streak===10||streak===15||streak===20)) toast(`${streak}問れんぞく 1回で正解！`); } else streak=0; }
  touch(); const before=wasDone; updateScore(); if(!before && wasDone && SUBMIT_URL) setTimeout(()=>toast("クリア！ いちばん下の「記録を送る」を押してね", 4000), 600); return r;
}
let wasDone=false, warned=false;
function goSend(){ const e=document.getElementById("sendbox"); if(e) e.scrollIntoView({behavior:"smooth", block:"center"}); }
/* もくじ・つぎへ を押したとき、まだ送っていなければ1回だけ知らせて送信欄へ */
function remindSend(){ if(!cur || warned || !needsSend(cur)) return false; warned=true; goSend(); toast("まだ記録を送っていないよ。「記録を送る」を押してから進もう（そのまま進むなら、もう一度押す）", 4500); return true; }
function toast(msg, ms){ ms=ms||1800; let t=document.getElementById("toast"); if(!t){ t=el("div","toast"); t.id="toast"; document.body.appendChild(t); } t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),ms); }

/* ---------- もくじ ---------- */
const app=document.getElementById("app");
function home(){

  document.documentElement.style.removeProperty("--zc"); document.documentElement.style.removeProperty("--zs");

  app.innerHTML=`
  <div class="hero"><div class="eb">数学Ⅱ　自分で進めるワーク</div><h1>なっとく数Ⅱ<small>指数・対数・三角関数・微分積分　全20回</small></h1>
  <p>動かして、ためして、「なるほど」をつかむ。答えるとすぐに○かどうかがわかる。1回30分くらい。</p></div>
  <div class="links"><a href="${MATOME_URL}" target="_blank" rel="noopener">📘 別冊「基本事項まとめ」</a>${SUBMIT_URL?(()=>{ const c=ASK.count(); return `<a href="#" id="myq">🤔 わたしの問い ${c.n}こ${c.unread?` <span class="pill warn">返事 ${c.unread}</span>`:""}</a>`; })():""}</div>
  <div class="who">
    <div><label for="nk">ニックネーム（記録を送るときに使う）</label><input id="nk" maxlength="20" value="${esc(ST.nick)}" placeholder="例：かじょう太郎"></div>
    <small class="whynote">本名でなくてよい。途中の記録はこのスマホの中に残る（同じブラウザで開けば続きから）。ぜんぶで ${allDone} / ${allTotal} 問</small>
  </div>
  ${ZONES.map((z,zi)=>{ const ls=LESSONS.filter(l=>l.zone===zi); let d=0,t=0; ls.forEach(l=>{const s=stats(l); d+=s.done; t+=s.total;});
    return `<section class="zone"><div class="zh"><span class="zn" style="color:var(${z.c})">${z.name}</span><span class="zs">${z.sub}</span><span class="zst">${d} / ${t}</span></div>
    <div class="lessons">${ls.map(les=>{ const s=stats(les), p=Math.round(100*s.done/s.total), sr=stars(s);
      return `<button class="lcard" data-l="${les.id}"><span class="no" style="background:var(${z.c})"><span><small>第</small>${les.no}<small>回</small></span></span>
      <span class="t">${R(les.title)}</span><span class="stars" aria-label="星${sr}">${[1,2,3].map(k=>`<span class="${k<=sr?"on":""}">★</span>`).join("")}</span>
      <span class="meta"><span class="track"><span style="width:${p}%;background:var(${z.c})"></span></span>${s.done}/${s.total}${needsSend(les)?' <span class="pill warn">未送信</span>':LS(les.id).sentAt?' <span class="pill">送信済</span>':''}</span></button>`; }).join("")}</div></section>`; }).join("")}
  <p class="note">📮 各回の最後に、いちばん下の「記録を送る」を押そう。押さないと記録は届かない（途中で送ってもよい。何回でも送り直せる）。</p>
  <p class="note">★1つ：全部とけた　★★：7割以上を1回目で正解　★★★：「答えを見る」なしで9割以上を1回目で正解</p>`;
  const nk=document.getElementById("nk");
  nk.addEventListener("input",()=>{ ST.nick=nk.value.trim(); save(); });
  app.querySelectorAll("[data-l]").forEach(b=>b.addEventListener("click",()=>open(b.dataset.l)));
  const mq=document.getElementById("myq"); if(mq) mq.addEventListener("click",e=>{ e.preventDefault(); ASK.page(); });

function updateScore(){
  if(!cur) return;
  const s=stats(cur); const sc=document.getElementById("sc"); if(sc) sc.textContent=s.done+" / "+s.total;
  const sk=document.getElementById("sk"); if(sk) sk.textContent = streak>=3 ? `🔥${streak}` : "";
  const sm=document.getElementById("sendsum"); if(sm) renderSendSum();
  const cl=document.getElementById("clear"); if(cl) cl.classList.toggle("on", s.done===s.total);
  wasDone = s.done===s.total;
  const sb=document.getElementById("sendbox"); if(sb) sb.classList.toggle("need", needsSend(cur));
}

/* ---------- 1回分 ---------- */
function open(id){
  cur=LESSONS.find(l=>l.id===id); streak=0; { const s0=stats(cur); wasDone=s0.done===s0.total; }
  const z=ZONES[cur.zone];
  document.documentElement.style.setProperty("--zc",`var(${z.c})`); document.documentElement.style.setProperty("--zs",`var(${z.s})`);
  app.innerHTML=`<div class="bar"><button class="back" id="bk">← もくじ</button><span class="ttl">第${cur.no}回　${R(cur.title)}</span><span class="streak" id="sk"></span><span class="sc" id="sc"></span></div>
  <div class="goal"><b>今日のゴール</b>　${R(cur.goal)}</div>
  ${SUBMIT_URL?`<button type="button" class="sendnote" id="sn"><span class="tx">📮 最後まで解いたら、いちばん下の<b>「記録を送る」</b>を押してね</span><span class="ar">↓</span></button>`:""}<div id="secs"></div>`;
  warned=false;

    sec.items.forEach(it=>{ const n=renderItem(it); if(n) d.appendChild(n); });
    box.appendChild(d);
  });
  box.appendChild(renderReflect());
  MEMO.enter(cur.id);
  updateScore(); window.scrollTo(0,0);
}

function fbSet(fb, ok, msg, hint){ fb.className="fb "+(ok?"ok":"ng"); fb.innerHTML=msg+(hint?`<span class="hint">ヒント：${R(hint)}</span>`:""); }
function showWhy(card, it){ if(it.why && !card.querySelector(".why")) card.appendChild(el("div","why",R(it.why))); }
function revealBtn(card, it, onReveal){
  if(card.querySelector(".reveal")) return;
  const b=el("button","reveal","答えを見る"); b.type="button";
  b.addEventListener("click",()=>{ b.remove(); onReveal(); });
  card.appendChild(b);
}

function renderItem(it){
  const st=LS(cur.id);
  if(it.t==="info"){ const c=el("div","card info"+(it.cls?" "+it.cls:""),`<span class="k">${it.k}</span>${R(it.html)}`); return c; }
  if(it.t==="fig"){ const box=el("div"); try{ W[it.name](box, it.arg||{}); }catch(e){ box.textContent="（図を表示できませんでした）"; console.error(e); } return box; }
  const card=el("div","card"); card.dataset.id=it.id;
  const r=st.items[it.id];

  if(it.t==="choice"||it.t==="multi"){
    card.appendChild(el("div","q",R(it.q)));
    const ops=el("div","opts"), fb=el("div","fb"); const picked=new Set();
    const isRight=i=> it.t==="multi" ? it.ans.includes(i) : i===it.ans;
    const finish=(msg)=>{ ops.querySelectorAll(".opt").forEach((x,i)=>{ x.disabled=true; x.classList.remove("sel","wrong"); if(isRight(i)) x.classList.add("right"); }); const g=card.querySelector(".go"); if(g) g.remove(); fbSet(fb,true,msg); showWhy(card,it); };
    it.opts.forEach((o,i)=>{
      const b=el("button","opt",R(o)); b.type="button";
      b.addEventListener("click",()=>{
        if(it.t==="choice"){
          const ok=i===it.ans; const rr=mark(it.id, ok);
          ops.querySelectorAll(".opt").forEach(x=>x.classList.remove("wrong"));
          if(ok) finish("○ せいかい！");
          else { b.classList.add("wrong"); fbSet(fb,false,"もう一度", it.hint); if(rr.tries>=2) revealBtn(card,it,()=>{ mark(it.id,true,true); finish("答え"); }); }
        } else { if(picked.has(i)){ picked.delete(i); b.classList.remove("sel"); } else { picked.add(i); b.classList.add("sel"); } }
      });
      ops.appendChild(b);
    });
    card.appendChild(ops);
    if(it.t==="multi"){
      const go=el("button","go","こたえる"); go.type="button";
      go.addEventListener("click",()=>{
        const ok=picked.size===it.ans.length && it.ans.every(a=>picked.has(a));
        const rr=mark(it.id, ok);
        if(ok) finish("○ せいかい！");
        else { fbSet(fb,false, picked.size<it.ans.length?"もう一度（まだ足りないかも）":"もう一度", it.hint); if(rr.tries>=2) revealBtn(card,it,()=>{ mark(it.id,true,true); finish("答え"); }); }
      });
      card.appendChild(go);
    }
    card.appendChild(fb);
    if(r&&r.ok) finish(r.shown?"答え":"○ せいかい！");
    else if(r&&r.tries>=2) revealBtn(card,it,()=>{ mark(it.id,true,true); finish("答え"); });
    return card;
  }

  if(it.t==="fill"){
    card.appendChild(el("div","q",R(it.q)));
    const row=el("div","fillrow"); const box=el("div","abox"); box.tabIndex=0; box.setAttribute("role","textbox");
    const go=el("button","go","こたえる"); go.type="button"; go.style.marginTop="0";
    const fb=el("div","fb");
    let val = st.texts["in-"+it.id] || "";
    const answerShow = ()=> it.show ? R(it.show) : EXPR.pretty(it.ans);
    const paint=(active)=>{ box.innerHTML = (val? EXPR.pretty(val) : (active?"":`<span class="ph">タップして入力</span>`)) + (active?'<span class="cur"></span>':""); };
    const done=(shown)=>{ box.classList.add("done"); box.classList.remove("act"); box.innerHTML = shown ? answerShow() : EXPR.pretty(val); go.remove(); fbSet(fb,true, shown?"答え":"○ せいかい！"); showWhy(card,it); if(kpTarget&&kpTarget.it===it) hideKP(); };
    const submit=()=>{
      if(!val){ fbSet(fb,false,"入力してから「こたえる」"); return; }
      if(!EXPR.valid(val)){ fbSet(fb,false,"式が読めない。かっこや記号を見直そう"); return; }
      const res=EXPR.same(val, it.ans, {x:!!it.x, c:!!it.c});
      if(res.needC && res.core){ const rr=mark(it.id,false); fbSet(fb,false,"式は合っている！ 最後に「＋C」をつけよう"); if(rr.tries>=2) revealBtn(card,it,()=>{ mark(it.id,true,true); done(true); }); return; }
      const rr=mark(it.id, res.ok);
      if(res.ok) done(false);
      else { fbSet(fb,false,"もう一度", it.hint); if(rr.tries>=2) revealBtn(card,it,()=>{ mark(it.id,true,true); done(true); }); }
    };
    const api={it, get:()=>val, set:v=>{ val=v; st.texts["in-"+it.id]=v; save(); paint(true); }, submit, box, card, paint, keys:(it.keys!=null?it.keys:(cur.kp||"")) + (it.x?"x":"") + (it.c?"C":"")};
    box.addEventListener("click",e=>{ e.stopPropagation(); if(!box.classList.contains("done")) showKP(api); });
    box.addEventListener("keydown",e=>{ if(box.classList.contains("done")) return; if(e.key==="Enter"){ e.preventDefault(); submit(); } else if(e.key==="Backspace"){ e.preventDefault(); api.set(val.slice(0,-1)); } else if(e.key.length===1 && /[0-9.+\-*/^()xCπ√]/.test(e.key)){ e.preventDefault(); api.set(val+e.key); } });
    go.addEventListener("click",submit);
    row.append(box, go); card.append(row, fb);
    if(r&&r.ok) done(r.shown); else { paint(false); if(r&&r.tries>=2) revealBtn(card,it,()=>{ mark(it.id,true,true); done(true); }); }
    return card;
  }

  if(it.t==="cls"){
    card.appendChild(el("div","q",R(it.q)));
    const wrap=el("div","cls"); const fb=el("div","fb");
    const check=()=>{ if(it.rows.every((_,i)=>{ const rr=st.items[it.id+"."+i]; return rr&&rr.ok; })){ fbSet(fb,true,"○ ぜんぶ せいかい！"); showWhy(card,it); } };
    it.rows.forEach((rw,ri)=>{
      const key=it.id+"."+ri, rr0=st.items[key];
      const line=el("div","r"); const lab=el("div",null,R(rw[0])); const ops=el("div","opts");
      const fin=()=>{ ops.querySelectorAll(".opt").forEach((x,oi)=>{ x.disabled=true; x.classList.remove("wrong"); if(oi===rw[1]) x.classList.add("right"); }); };
      it.opts.forEach((o,oi)=>{ const b=el("button","opt",R(o)); b.type="button";
        b.addEventListener("click",()=>{ const ok=oi===rw[1]; const rr=mark(key,ok);
          ops.querySelectorAll(".opt").forEach(x=>x.classList.remove("wrong"));
          if(ok){ fin(); check(); } else { b.classList.add("wrong"); if(rr.tries>=2){ mark(key,true,true); fin(); fbSet(fb,false,"まちがえた行は答えを表示した"); check(); } else fbSet(fb,false,"もう一度"); }
        }); ops.appendChild(b); });
      line.append(lab, ops); wrap.appendChild(line);
      if(rr0&&rr0.ok) fin();
    });
    card.append(wrap, fb); check(); return card;
  }

  if(it.t==="free"){
    card.appendChild(el("div","q",R(it.q)));
    const ta=el("textarea"); ta.value=st.texts[it.id]||""; ta.addEventListener("input",()=>{ st.texts[it.id]=ta.value; touch(); });
    card.appendChild(ta); return card;
  }
  return null;
}

/* ---------- 入力用キーパッド ---------- */
let kpEl=null, kpTarget=null;
function showKP(api){
  MEMO.hide(); MEMO.setFab(false);
  if(kpTarget && kpTarget!==api){ kpTarget.box.classList.remove("act"); kpTarget.paint(false); }
  kpTarget=api; api.box.classList.add("act"); api.paint(true);
  if(!kpEl){ kpEl=el("div","kp"); document.body.appendChild(kpEl); }
  const ex=api.keys;
  const has=c=>ex.includes(c), H=c=>has(c)?"":"hide", xs=has("x");
  const K=[["7"],["8"],["9"],["/","op"],["^",xs||has("^")?"op":"hide"],["⌫","fx cls2"],
           ["4"],["5"],["6"],["+",xs?"op":"hide"],["(",xs?"op":"hide"],[")",xs?"op":"hide"],
           ["1"],["2"],["3"],["−","op"],["x",xs?"op":"hide"],["√",has("√")?"op":"hide"],
           ["0"],["."],["π",has("π")?"op":"hide"],["C",has("C")?"op":"hide"],["こたえる","ent fx"]];
  kpEl.innerHTML=`<div class="in"><div class="kph"><span>${kpHelp(ex)}</span><button type="button" class="kpclose" data-k="close">とじる ✕</button></div><div class="keys">${K.map(k=>k[1]==="hide"?`<span class="kpgap"></span>`:`<button type="button" class="${k[1]||""}" data-k="${k[0]}">${k[0]==="x"||k[0]==="C"?`<i>${k[0]}</i>`:k[0]}</button>`).join("")}</div></div>`;
  kpEl.querySelectorAll("button").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); const k=b.dataset.k, v=kpTarget.get();
    if(k==="⌫") kpTarget.set(v.slice(0,-1));
    else if(k==="close") hideKP();
    else if(k==="こたえる") kpTarget.submit();
    else kpTarget.set(v+(k==="−"?"-":k));
  }));
  kpEl.style.display="block";
  requestAnimationFrame(()=>{ const kh=kpEl.offsetHeight, rc=api.card.getBoundingClientRect(); const over=rc.bottom-(window.innerHeight-kh-8); if(over>0) window.scrollBy({top:over, behavior:"smooth"}); else if(rc.top<60) window.scrollBy({top:rc.top-70, behavior:"smooth"}); });
  document.querySelector(".wrap").style.paddingBottom="320px";
}
function kpHelp(ex){
  const t=["分数は 3/4"];
  if(ex.includes("x")) t.push("x² は x ^ 2"); if(ex.includes("√")) t.push("2√3 は 2 √ 3"); if(ex.includes("π")) t.push("2π/3 は 2 π / 3"); if(ex.includes("C")) t.push("最後に ＋C");
  return t.join("　");
}
function hideKP(){
  if(kpTarget){ kpTarget.box.classList.remove("act"); if(!kpTarget.box.classList.contains("done")) kpTarget.paint(false); }
  kpTarget=null; if(kpEl) kpEl.style.display="none"; MEMO.setFab(true);
  const w=document.querySelector(".wrap"); if(w) w.style.paddingBottom="";
}
document.addEventListener("click",e=>{ if(!kpTarget) return; if(kpEl&&kpEl.contains(e.target)) return; if(kpTarget.card.contains(e.target)) return; hideKP(); });

/* ---------- ふりかえり・送信 ---------- */
function renderSendSum(){
  const s=stats(cur), st=LS(cur.id), e=document.getElementById("sendsum");
  e.innerHTML=`解いた数 <b>${s.done}</b> / ${s.total}　1回目で正解 <b>${s.first}</b>　取り組み時間 <b>${s.minutes}</b>分`+(needsSend(cur)?`<br><span class="pill warn">${st.sentAt?"送ったあとに解いた分がまだ届いていない":"まだ送っていない"}</span>`:st.sentAt?`<br><span class="pill">送信済み ${st.sentAt}</span>（何回でも送り直せる）`:"");
}
function renderReflect(){
  const st=LS(cur.id);
  const d=el("section","sec");
  d.innerHTML=`<div class="sh"><span class="tag" style="background:var(--t5)">ふりかえり</span><h2>今日の自分をチェック</h2></div>`;
  const c1=el("div","card"); c1.appendChild(el("div","q","今日のゴールは達成できた？"));
  const rate=el("div","rate"); ["◎","○","△"].forEach(x=>{ const b=el("button","opt"+(st.rate===x?" sel":""),x); b.type="button";
    b.addEventListener("click",()=>{ st.rate=x; touch(); rate.querySelectorAll(".opt").forEach(z=>z.classList.toggle("sel",z.textContent===x)); }); rate.appendChild(b); });
  c1.appendChild(rate);
  const mk=(key,q)=>{ const c=el("div","card"); c.appendChild(el("div","q",q)); const ta=el("textarea"); ta.value=st.texts[key]||""; ta.addEventListener("input",()=>{ st.texts[key]=ta.value; touch(); }); c.appendChild(ta); return c; };
  d.append(c1, mk("learned","今日「なるほど」と思ったことを一言"), mk("unclear","まだモヤモヤしていること（なければ「なし」）"));
  if(SUBMIT_URL) d.appendChild(ASK.card());
  const cl=el("div","clear",`<span class="stamp">クリア</span><p>最後に、下の「記録を送る」を押そう 📮</p>`); cl.id="clear"; d.appendChild(cl);
  const sd=el("div","send"); sd.id="sendbox"; sd.innerHTML=`<div class="q">📮 記録を送る</div><div class="sum" id="sendsum"></div>`;
  if(SUBMIT_URL){
    const a=el("a","go","記録を送る"); a.target="_blank"; a.rel="noopener"; const warn=el("small");
    const ready=()=>!!ST.nick;
    const upd=()=>{ if(ready()){ a.href=buildUrl(); a.removeAttribute("aria-disabled"); a.style.opacity=""; warn.textContent="新しいタブで「送信しました」と出たら完了。タブを閉じてここにもどろう。"; }
      else { a.removeAttribute("href"); a.setAttribute("aria-disabled","true"); a.style.opacity=".4"; warn.textContent="もくじにもどって、ニックネームを入れてから送ろう。"; } };
    a.addEventListener("pointerdown",upd); a.addEventListener("focus",upd);
    a.addEventListener("click",()=>{ upd(); if(!ready()) return; const t=new Date(); st.sentAt=(t.getMonth()+1)+"/"+t.getDate()+" "+t.getHours()+":"+String(t.getMinutes()).padStart(2,"0"); st.sentDone=stats(cur).done; save(); setTimeout(()=>{ renderSendSum(); updateScore(); },50); });
    upd(); sd.append(a, warn);
  } else sd.appendChild(el("small",null,"送信先はまだ設定されていない。記録はこのスマホの中に残っている。"));
  d.appendChild(sd);
  const nx=LESSONS[LESSONS.indexOf(cur)+1];
  if(nx){ const b=el("button","go sub",`つぎへ：第${nx.no}回 ${R(nx.title)}`); b.type="button"; b.style.marginTop="16px"; b.addEventListener("click",()=>{ if(remindSend()) return; open(nx.id); }); d.appendChild(b); }
  setTimeout(renderSendSum,0);
  return d;
}
function buildUrl(){
  const st=LS(cur.id), s=stats(cur);
  const texts=[]; cur.secs.forEach(sec=>sec.items.forEach(it=>{ if(it.t==="free"&&st.texts[it.id]) texts.push(st.texts[it.id]); }));
  const p={lesson:cur.no, nick:ST.nick, dev:ST.dev, done:s.done, total:s.total, first:s.first, shown:s.shown, tries:s.tries, minutes:s.minutes,
           rate:st.rate, learned:st.texts.learned||"", unclear:st.texts.unclear||"", texts:texts.join(" / "), ver:APP_VER};
  return SUBMIT_URL+"?"+Object.entries(p).map(([k,x])=>k+"="+encodeURIComponent(String(x).slice(0,500))).join("&");
}

try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(cur) open(cur.id); }); }catch(e){}
save(); home();
